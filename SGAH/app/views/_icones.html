{# ícones em SVG (traço simples), usados com {{ icone('nome') }} #}
{% macro icone(nome) -%}
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {%- if nome == 'painel' %}
    <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
    {%- elif nome == 'suprimentos' %}
    <path d="M16.5 9.4 7.5 4.21"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
    {%- elif nome == 'abrigos' %}
    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
    {%- elif nome == 'operacoes' %}
    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    {%- elif nome == 'sair' %}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
    {%- elif nome == 'local' %}
    <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    {%- elif nome == 'lua' %}
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    {%- elif nome == 'sol' %}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    {%- elif nome == 'alerta' %}
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>
    {%- elif nome == 'cobertura' %}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>
    {%- elif nome == 'usuario' %}
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    {%- elif nome == 'cadeado' %}
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    {%- elif nome == 'olho' %}
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
    {%- elif nome == 'voltar' %}
    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
    {%- elif nome == 'lixeira' %}
    <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    {%- elif nome == 'editar' %}
    <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
    {%- elif nome == 'mais' %}
    <path d="M12 5v14M5 12h14"/>
    {%- elif nome == 'info' %}
    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
    {%- elif nome == 'busca' %}
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    {%- elif nome == 'fechar' %}
    <path d="M18 6 6 18M6 6l12 12"/>
    {%- elif nome == 'ok' %}
    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
    {%- elif nome == 'check' %}
    <path d="M20 6 9 17l-5-5"/>
    {%- endif %}
</svg>
{%- endmacro %}
